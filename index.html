<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Gen-Z Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .login-box {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center; max-width: 400px; margin: 50px auto;
        }

        input, button, textarea {
            padding: 12px; border-radius: 8px; border: 1px solid #ddd;
            width: 100%; margin-bottom: 10px; box-sizing: border-box;
        }

        button {
            background: #1e88e5; color: white; font-weight: bold;
            cursor: pointer; border: none; transition: 0.3s;
        }

        button:hover { background: #1565c0; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;
            border-bottom: 4px solid #1e88e5;
        }

        .stat-card h3 { margin: 0; font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #1e293b; margin-top: 10px; display: block; }

        .chart-container {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
        }

        .feedback-item {
            background: white; padding: 20px; border-radius: 12px;
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #1e88e5;
        }

        .feedback-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: #64748b; font-size: 0.9rem; }
        .message-content { font-size: 1.1rem; color: #333; margin-bottom: 15px; font-style: italic; }
        .reply-area { background: #f8faff; padding: 15px; border-radius: 8px; }
        .badge-replied { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
        .badge-pending { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    </style>
</head>

<body>

    <div id="loginSection" class="login-box">
        <h2 style="margin-top:0">Admin Control</h2>
        <h4 style="margin: 10px 0;">Vui lòng nhập mật khẩu để truy cập bảng điều khiển</h4>
        <input type="password" id="pw" placeholder="Mật khẩu Admin">
        <button onclick="handleLogin()">Đăng nhập Hệ thống</button>
    </div>

    <div id="dashboard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0">Bảng Điều Khiển Gen-Z Compass</h2>
            <button onclick="refreshAllData()" style="width: auto; padding: 8px 20px;">Làm mới Dữ liệu</button>
        </div>

        <div class="dashboard-layout">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Tổng số lượt Test</h3>
                    <span class="value" id="stat-total-test">--</span>
                </div>
                <div class="stat-card">
                    <h3>Phản hồi chờ xử lý</h3>
                    <span class="value" id="stat-pending-feedback" style="color: #ef4444;">--</span>
                </div>
                <div class="stat-card" style="grid-column: span 2">
                    <h3>Tỷ lệ chuyển đổi Phản hồi</h3>
                    <span class="value" id="stat-ratio">0%</span>
                </div>
            </div>

            <div class="chart-container">
                <h3 style="margin-top:0; font-size: 0.9rem; color: #64748b;">TỶ LỆ NHÓM NGHỀ</h3>
                <div style="width: 100%; max-width: 250px;">
                    <canvas id="adminPieChart"></canvas>
                </div>
            </div>
        </div>

        <h3>Chi tiết Phản hồi từ người dùng</h3>
        <div id="list">Đang tải dữ liệu...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxydpKMv-4ZrXAke1TTEzkuvqGU4wPQj-eUt5lzxwjYjKBDHQaUSANC25EvT3C56wv2-A/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC0uuIGC8eFwNEYyOeHZ-stqWxDfwojBe8",
            authDomain: "webk-135af.firebaseapp.com",
            projectId: "webk-135af",
            storageBucket: "webk-135af.firebasestorage.app",
            messagingSenderId: "159148568183",
            appId: "1:159148568183:web:9816e1b3e969224ecca072"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myPieChart = null; // Biến lưu trữ instance của biểu đồ

        async function handleLogin() {
            const pw = document.getElementById('pw').value;
            if (!pw) return alert("Vui lòng nhập mật khẩu!");
            const success = await loadFeedbacks();
            if (success) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadFirebaseStats();
            }
        }

        async function refreshAllData() {
            await loadFeedbacks();
            await loadFirebaseStats();
        }

        async function loadFeedbacks() {
            const password = document.getElementById('pw').value;
            try {
                const res = await fetch(`${API}?action=get&pw=${password}`);
                const json = await res.json();
                if (!json.success) { alert("Sai mật khẩu!"); return false; }

                const rows = json.data;
                document.getElementById('stat-pending-feedback').innerText = rows.filter(f => !f.reply).length;

                document.getElementById('list').innerHTML = rows.length === 0 
                    ? "<p>Chưa có phản hồi.</p>" 
                    : rows.map(f => `
                        <div class="feedback-item">
                            <div class="feedback-header">
                                <span><b>${f.name}</b> (${f.email})</span>
                                ${f.reply ? '<span class="badge-replied">Đã trả lời</span>' : '<span class="badge-pending">Chờ xử lý</span>'}
                            </div>
                            <div class="message-content">"${f.message}"</div>
                            <div class="reply-area">
                                <textarea id="reply-${f.id}" rows="2">${f.reply || ""}</textarea>
                                <button onclick="submitReply(${f.id}, '${f.email}')" style="width:auto">Trả lời Feedback</button>
                            </div>
                        </div>
                    `).reverse().join("");
                
                updateRatio();
                return true;
            } catch (err) { return false; }
        }

        async function loadFirebaseStats() {
            try {
                const snapshot = await db.collection("results").get();
                const total = snapshot.size;
                document.getElementById('stat-total-test').innerText = total;

                // Thống kê từng nhóm nghề
                const counts = { "Kỹ thuật": 0, "Nghiên cứu": 0, "Nghệ thuật": 0, "Xã hội": 0, "Quản lý": 0, "Nghiệp vụ": 0 };
                snapshot.forEach(doc => {
                    const cat = doc.data().result_category;
                    if (counts[cat] !== undefined) counts[cat]++;
                });

                renderPieChart(counts);
                updateRatio();
            } catch (err) { console.error(err); }
        }

        function renderPieChart(dataObj) {
            const ctx = document.getElementById('adminPieChart').getContext('2d');
            
            // Nếu đã có biểu đồ trước đó, xóa đi để vẽ mới
            if (myPieChart) myPieChart.destroy();

            myPieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        data: Object.values(dataObj),
                        backgroundColor: ['#1e88e5', '#43a047', '#ffb300', '#f44336', '#9c27b0', '#607d8b'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
                    }
                }
            });
        }

        function updateRatio() {
            const tests = parseInt(document.getElementById('stat-total-test').innerText) || 0;
            const feedbacks = document.getElementsByClassName('feedback-item').length || 0;
            if (tests > 0) {
                document.getElementById('stat-ratio').innerText = ((feedbacks / tests) * 100).toFixed(1) + "%";
            }
        }

        async function submitReply(id, email) {
            const pw = document.getElementById('pw').value;
            const text = document.getElementById(`reply-${id}`).value;
            const btn = event.target;
            btn.innerText = "...";
            try {
                const params = new URLSearchParams();
                params.append("action", "reply"); params.append("id", id);
                params.append("reply", text); params.append("pw", pw);
                await fetch(API, { method: "POST", body: params });
                alert("Đã lưu!");
                loadFeedbacks();
            } catch (err) { alert("Lỗi!"); }
        }
    </script>
</body>
</html>
