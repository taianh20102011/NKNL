<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Gen-Z Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
        }

        input,
        button,
        textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background: #1e88e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #1565c0;
        }

        .feedback-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #1e88e5;
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .message-content {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 15px;
        }

        .reply-area {
            background: #f8faff;
            padding: 15px;
            border-radius: 8px;
        }

        .badge-replied {
            background: #dcfce7;
            color: #166534;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .badge-pending {
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <div id="loginSection" class="login-box">
        <h2>Admin Login</h2>
        <input type="password" id="pw" placeholder="Nhập mật khẩu Admin">
        <button onclick="loadFeedbacks()">Đăng nhập & Tải dữ liệu</button>
    </div>

    <div id="dashboard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Danh sách Phản hồi</h2>
            <button onclick="loadFeedbacks()" style="width: auto;">Làm mới</button>
        </div>
        <div id="list">Đang tải...</div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxydpKMv-4ZrXAke1TTEzkuvqGU4wPQj-eUt5lzxwjYjKBDHQaUSANC25EvT3C56wv2-A/exec";

        async function loadFeedbacks() {
            const password = document.getElementById('pw').value;
            if (!password) return alert("Vui lòng nhập mật khẩu!");

            document.getElementById('list').innerHTML = "Đang kết nối đến Google Sheets...";

            try {
                // Gọi API với action=get
                const res = await fetch(API + "?action=get&pw=" + password);
                const json = await res.json();

                if (!json.success) {
                    alert(json.error || "Sai mật khẩu hoặc lỗi hệ thống");
                    return;
                }

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                const rows = json.data; // Giả sử API trả về { success: true, data: [...] }

                if (rows.length === 0) {
                    document.getElementById('list').innerHTML = "Chưa có phản hồi nào.";
                    return;
                }

                document.getElementById('list').innerHTML = rows.map(f => `
                    <div class="feedback-item">
                        <div class="feedback-header">
                            <span><b>${f.name}</b> (${f.email})</span>
                            ${f.reply ? '<span class="badge-replied">Đã trả lời</span>' : '<span class="badge-pending">Chờ xử lý</span>'}
                        </div>
                        <div class="message-content">
                            "${f.message}"
                        </div>
                        <div class="reply-area">
                            <label style="font-size:0.9rem; font-weight:600;">Trả lời:</label>
                            <textarea id="reply-${f.id}" rows="3" placeholder="Nhập câu trả lời...">${f.reply || ""}</textarea>
                            <button onclick="submitReply(${f.id}, '${f.email}')">Lưu & Gửi</button>
                        </div>
                    </div>
                `).join("");

            } catch (err) {
                console.error(err);
                document.getElementById('list').innerHTML = "Lỗi tải dữ liệu. Kiểm tra Console.";
            }
        }

        async function submitReply(id, email) {
            const password = document.getElementById('pw').value;
            const text = document.getElementById(`reply-${id}`).value;

            if (!text) return alert("Chưa nhập nội dung!");

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Đang lưu...";
            btn.disabled = true;

            try {
                // Gửi qua URLSearchParams để Google Script dễ nhận diện và tránh lỗi CORS Preflight
                const params = new URLSearchParams();
                params.append("action", "reply");
                params.append("id", id);
                params.append("reply", text);
                params.append("pw", password);

                const res = await fetch(API, {
                    method: "POST",
                    body: params // Gửi dưới dạng form-urlencoded
                });

                // Với Google Script, POST đôi khi không trả về kết quả nếu không cấu hình kỹ
                // Nhưng nếu res.ok hoặc không crash là đã tới được server
                alert("Đã gửi yêu cầu lưu thành công!");
                btn.innerText = "Đã lưu";
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối. Vui lòng kiểm tra lại URL API.");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
    </script>
</body>

</html>
